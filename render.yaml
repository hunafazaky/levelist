# Render static site. Create it with New > Blueprint, or copy these settings into a Static Site by hand.
# Keep the headers in step with vercel.json.
services:
  - type: web
    runtime: static
    name: daily-quest
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache"
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "no-cache"
    envVars:
      - key: NODE_VERSION
        value: 22
